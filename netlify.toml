# The site at https://findra-search.netlify.app is static files. There is no build step, nothing
# to compile and no framework: everything under website/public is deployed exactly as it sits in
# the repository, and the two generators that produce some of it - build/Make-Pages.mjs and
# build/Make-Icon.mjs - are run by hand and are not known to this file or to Netlify.
#
# There is one exception to "static files", and it is netlify/edge-functions/markdown.ts. Serving
# a page as Markdown to an agent that asked for it with an Accept header cannot be done with a
# header rule or a redirect, because neither can read Accept. Everything else here is a file.

[build]
  publish = "website/public"
  command = ""

# A page that sells "nothing leaves your machine" should not itself be reaching out.
# The policy below permits the two Google Fonts hosts and nothing else - no analytics,
# no beacons, no third-party scripts, and no way for one to be added by accident.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# styles.css and app.js are on every page and were revalidated on every navigation, which is
# two conditional requests per view with the stylesheet on the critical path. An hour of staleness
# after a deploy is the trade; neither filename is fingerprinted and there is no build step here
# that could fingerprint one.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/share/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The Markdown twins of the four pages, plus llms.txt. Served as text/markdown rather than as a
# download, and declared as varying on Accept because these same bytes are what the edge function
# hands back from the page URLs - a cache that does not know that will serve one variant for both.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"
    Cache-Control = "public, max-age=0, must-revalidate"

# The Markdown twins are the same prose as the pages, at a second URL, both crawlable and both
# 200. rel="alternate" is a discovery hint and does not consolidate anything, so each twin names
# the page it belongs to. A robots disallow would be the wrong tool: a blocked URL cannot be
# crawled, so this header would never be read, and the twins exist for the agents it would block.
[[headers]]
  for = "/index.md"
  [headers.values]
    Link = "<https://findra-search.netlify.app/>; rel=\"canonical\""

[[headers]]
  for = "/about.md"
  [headers.values]
    Link = "<https://findra-search.netlify.app/about/>; rel=\"canonical\""

[[headers]]
  for = "/contact.md"
  [headers.values]
    Link = "<https://findra-search.netlify.app/contact/>; rel=\"canonical\""

[[headers]]
  for = "/privacy.md"
  [headers.values]
    Link = "<https://findra-search.netlify.app/privacy/>; rel=\"canonical\""

[[headers]]
  for = "/code-signing.md"
  [headers.values]
    Link = "<https://findra-search.netlify.app/code-signing/>; rel=\"canonical\""

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
