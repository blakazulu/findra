name: build

# Every push, not just main. The settled decision was continuous integration on every push, and a
# branch filter means a branch pushed without a pull request is never built - which is most of how
# work actually arrives here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Node is here for two checks on the site and nothing else. It does NOT build anything: the
      # mark and the written pages are generated by hand and what they produced is committed, so
      # `dotnet build`, the publish script, the installer, the release and the catalogue workflows
      # still do not know node exists. It runs the edge function's own test, because that function
      # is TypeScript on Deno and the xUnit suite cannot execute it, and it runs the page generator
      # to prove nobody forgot to.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: the site's markdown negotiation
        run: node tests/edge/markdown.test.mjs

      # The written pages, their Markdown twins, the front page's version stamp and the footer are
      # all produced by build/Make-Pages.mjs, which is run by hand. Run it again here and require
      # that it changes nothing: a source edited and committed without it is a site that still says
      # the old thing, and this is where that fails rather than on the live page. The sitemap is
      # left out because its front-page date comes from git history, which a shallow clone does not
      # have.
      - name: the site is what its generator makes
        shell: bash
        run: |
          node build/Make-Pages.mjs
          git diff --exit-code -- website/public ':(exclude)website/public/sitemap.xml'

      - name: build
        run: dotnet build --configuration Release -warnaserror

      - name: test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Published rather than run from bin/: the diagnostics are checked in the shape a stranger
      # gets them, self-contained, with no SDK underneath.
      - name: publish
        run: pwsh -File build/Publish.ps1 -Rid win-x64

      - name: the headless diagnostics
        run: pwsh -File build/Check-Diagnostics.ps1 -Exe publish/win-x64/findra.exe
